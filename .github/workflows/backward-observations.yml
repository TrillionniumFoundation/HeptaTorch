name: Pinned PyTorch backward failure observations
on:
  push:
    branches: ["feature/native-tensor-objects", "feature/native-backward-release", "feature/native-backward-partial", "feature/native-cpu-generators", "feature/native-gradient-none", "feature/native-optimizer-objects"]
  pull_request:
    paths: ["tests/pytorch_backward_release_probe.py", "tests/pytorch_backward_partial_probe.py", "tests/pytorch_gradient_presence_probe.py", "tests/pytorch_gradient_signed_zero_probe.py", "tests/pytorch_grad_clear_probe.py", "tests/pytorch_optimizer_object_probe.py", "tests/pytorch_requires_grad_probe.py", "tests/pytorch_accumulator_lifetime_probe.py", "tests/pytorch_bernoulli_dropout_probe.py", "tests/pytorch_uniform_probe.py", "tests/pytorch_uniform_range_probe.py", ".github/workflows/backward-observations.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install exact independent PyTorch wheel
        run: |
          python3 - <<'PY'
          import json,platform,subprocess,sys
          from pathlib import Path
          x=json.load(open('compatibility/pytorch-oracle-lock.json'))['oracle']
          assert list(sys.version_info[:2])==x['python']['version'] and platform.machine()=='x86_64'
          url=x['wheel']['url']+'#sha256='+x['wheel']['sha256']
          Path(x['install_report']).parent.mkdir(parents=True,exist_ok=True)
          subprocess.run([sys.executable,'-m','pip','install','--disable-pip-version-check','--force-reinstall',
             '--index-url','https://download.pytorch.org/whl/cpu','--report',x['install_report'],url],check=True)
          PY
      - name: Verify frozen independent observation sources
        run: |
          echo '1192de6e175407756b01028278446067b22b70fe2d820f0045f6f5d623d46aa3  tests/pytorch_backward_release_probe.py' | sha256sum -c -
          echo '2dc9a76462368f5bb227f02d5e401e10505e38676c9fe9b04460c1dae2d2c970  tests/pytorch_backward_partial_probe.py' | sha256sum -c -
          echo 'b368fd752485bd40a109712fffe156f6dfb43e48c4c1c971f9836e54bc861306  tests/pytorch_gradient_presence_probe.py' | sha256sum -c -
          echo 'a27756cc3be9603dbaa6b21465a3258d148f6ff3fde1f5df9ed7c8b0d93f9876  tests/pytorch_uniform_probe.py' | sha256sum -c -
          echo '4e31fd8fcabf0349a31a3f833906776567c54a467e28f8eba833ca7d5df61d2c  tests/pytorch_gradient_signed_zero_probe.py' | sha256sum -c -
          echo 'a607164e51891c0c45922b5cd596e14fb8ecc6f176e0585757aebb56e106e29f  tests/pytorch_uniform_range_probe.py' | sha256sum -c -
          echo 'f34e98011e62bdac2eb94beb5a07c043bde09d2fc8d9c416e52e22d278c96b50  tests/pytorch_grad_clear_probe.py' | sha256sum -c -
          echo 'f69340170dc2e55886bca73a8d37265ba2c95a8c793c7633c7e8a22234cfa386  tests/pytorch_optimizer_object_probe.py' | sha256sum -c -
          echo 'aeccf1ed21501682df772bbc9e05ccdaf821e93bb243a6f2a045c05035e56ad3  tests/pytorch_requires_grad_probe.py' | sha256sum -c -
          echo '1597219302665e79a840305f2ead58bdfd5472ddca97b0a4092c8d0dd8de96e2  tests/pytorch_accumulator_lifetime_probe.py' | sha256sum -c -
          echo 'db00efdf0cca14b3b3f25545e8a59a27308ca128d861e04086c18bd1edb6d3a4  tests/pytorch_bernoulli_dropout_probe.py' | sha256sum -c -
      - name: Observe default Saved release and repeat backward
        run: |
          python3 tests/pytorch_backward_release_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-backward-release.json
          python3 -I -S -B tools/emit_ci_report.py build/torch-backward-release.json
      - name: Observe actual node ordering and partial gradients after failures
        run: |
          python3 tests/pytorch_backward_partial_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-backward-partial.json
          python3 -I -S -B tools/emit_ci_report.py build/torch-backward-partial.json
      - name: Observe absent gradients and optimizer skips against defined zeros
        run: |
          python3 tests/pytorch_gradient_presence_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-gradient-presence.json > build/torch-gradient-presence.stdout
          python3 -I -S -B tools/emit_ci_report.py build/torch-gradient-presence.json
      - name: Observe uniform rounding traversal and empty mutation boundaries
        run: |
          python3 tests/pytorch_uniform_probe.py \
            --support tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --executable build/heptatorch --output build/pytorch-uniform-probe.json > build/pytorch-uniform-probe.stdout
          python3 -I -S -B tools/emit_ci_report.py build/pytorch-uniform-probe.json
      - name: Observe first gradient materialization and signed zero bits
        run: |
          python3 tests/pytorch_gradient_signed_zero_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-gradient-signed-zero.json > build/torch-gradient-signed-zero.stdout
          python3 -I -S -B tools/emit_ci_report.py build/torch-gradient-signed-zero.json
      - name: Observe binary64 uniform interval admission at binary32 maximum
        run: |
          python3 tests/pytorch_uniform_range_probe.py \
            --support tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --executable build/heptatorch --output build/pytorch-uniform-range-probe.json > build/pytorch-uniform-range-probe.stdout
          python3 -I -S -B tools/emit_ci_report.py build/pytorch-uniform-range-probe.json
      - name: Observe actual gradient release and optimizer state skipping
        run: |
          python3 tests/pytorch_grad_clear_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-grad-clear.json > build/torch-grad-clear.stdout
          python3 -I -S -B tools/emit_ci_report.py build/torch-grad-clear.json
      - name: Observe actual Optimizer state objects groups and strong references
        run: |
          python3 tests/pytorch_optimizer_object_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-optimizer-objects.json > build/torch-optimizer-objects.stdout
          python3 -I -S -B tools/emit_ci_report.py build/torch-optimizer-objects.json
      - name: Observe leaf flag changes existing gradients and captured edges
        run: |
          python3 tests/pytorch_requires_grad_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-requires-grad.json > build/torch-requires-grad.stdout
          python3 -I -S -B tools/emit_ci_report.py build/torch-requires-grad.json
      - name: Observe actual Bernoulli and dropout state dispatch and autograd
        run: |
          python3 tests/pytorch_bernoulli_dropout_probe.py \
            --support tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --executable build/heptatorch --output build/torch-bernoulli-dropout.json > build/torch-bernoulli-dropout.stdout
          python3 -I -S -B tools/emit_ci_report.py build/torch-bernoulli-dropout.json
      - name: Observe captured accumulator ownership after flag changes and public drops
        run: |
          python3 tests/pytorch_accumulator_lifetime_probe.py \
            --reference tests/pytorch_oracle.py --lock compatibility/pytorch-oracle-lock.json \
            --repo . --output build/torch-accumulator-lifetime.json > build/torch-accumulator-lifetime.stdout
          python3 -I -S -B tools/emit_ci_report.py build/torch-accumulator-lifetime.json
