name: Current HIA Runtime

on:
  push:
    branches:
      - main
  # Each PR runs the full current-runtime gate; merged main gets its own run.
  # Limit push to main so a feature push and its PR do not duplicate this gate.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    outputs:
      evidence-artifact-id: ${{ steps.evidence_upload.outputs.artifact-id }}
      evidence-artifact-digest: ${{ steps.evidence_upload.outputs.artifact-digest }}
      evidence-artifact-bytes: ${{ steps.transport_plan.outputs.artifact-bytes }}
      evidence-rest-head-sha: ${{ steps.transport_plan.outputs.rest-head-sha }}
      evidence-run-attempt: ${{ steps.transport_plan.outputs.run-attempt }}
      transport-helper-sha256: ${{ steps.transport_plan.outputs.helper-sha256 }}
      transport-parts: ${{ steps.transport_plan.outputs.parts }}
    defaults:
      run:
        shell: bash
    steps:

      - name: Set the current runtime evidence directory
        run: printf 'CURRENT_OUTPUT=%s/heptatorch-current\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out HeptaTorch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require the current build to start without historical143 source
        run: |
          test -z "$(git ls-files -- src/heptatorch.hepta)"
          test ! -e src/heptatorch.hepta
          test ! -L src/heptatorch.hepta

      - name: Check that the complete upstream target remains recorded
        run: |
          python3 -I -S -B tools/check_acceptance.py
          python3 -I -S -B tests/check_acceptance_negative.py
          python3 -I -S -B tests/check_acceptance_contracts.py

      - name: Check lossless original artifact transfer and failure handling
        run: python3 -I -S -B tests/test_ci_artifact_transport.py

      - name: Check out the pinned HIA toolchain sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: .toolchain/hepta
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            hepta
            tools
            examples/hia_bootstrap
            docs

      - name: Check out the fixed historical legacy-compiler witness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TrillionniumFoundation/HeptaTorch
          ref: 31d5b1483714b32254730ba56787884c5c76e2fb
          path: .toolchain/heptatorch-legacy
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            src

      - name: Bootstrap and reproduce the native HIA compiler
        shell: bash
        run: |
          python3 -I -S -B - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          import sys

          root = Path('.toolchain/hepta').resolve()
          output = Path(os.environ['RUNNER_TEMP']) / 'hepta-compiler'
          output.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(root))
          from tools.qualify_hia_selfhost import build_seed, compile_stage

          expected_commit = 'f33d8da316de8fdf27b504371f1a5310997ff548'
          expected_source = '388b182e42675f11435867dd99520e9452a4ff48e23c0766a3952b662acc7627'
          expected_compiler = '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54'
          head = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          if head != expected_commit:
              raise RuntimeError('unexpected HIA source commit')
          source = (root / 'examples/hia_bootstrap/selfhost.hepta').read_bytes()
          if hashlib.sha256(source).hexdigest() != expected_source:
              raise RuntimeError('unexpected HIA compiler source digest')

          # B0 is the external bootstrap boundary: Python assembler and GNU ld.
          # B1 onward are compiled by preceding HIA machine code. The upstream
          # stdlib child transports fixed ABI buffers; it does not compile them.
          image, seed = build_seed(output, source)
          generations = []
          for label in ('B1', 'B2', 'B3'):
              image, receipt = compile_stage(
                  output, label, image, source,
                  image_format='seed-shared' if label == 'B1' else 'flat-x86-64')
              generations.append(receipt['produced_sha256'])
          if len(set(generations)) != 1:
              raise RuntimeError('B1/B2/B3 compiler images differ')

          old = b'hia-asm.v1 hepta.hia.program.v8 selfhost\n'
          new = b'hia-asm.v1 hepta.hia.program.v8 selfhost_exec\n'
          if not source.startswith(old):
              raise RuntimeError('unexpected compiler module header')
          executable_source = new + source[len(old):]
          compiler, receipt = compile_stage(
              output, 'native-compiler', image, executable_source,
              output_extension='')
          compiler.chmod(0o755)
          compiler_bytes = compiler.read_bytes()
          if hashlib.sha256(compiler_bytes).hexdigest() != expected_compiler:
              raise RuntimeError('unexpected native compiler digest')

          # The standalone compiler performs two further rebuilds with no PATH.
          previous = compiler
          for generation in (1, 2):
              result = subprocess.run(
                  [str(previous)], input=executable_source, capture_output=True,
                  timeout=20, env={'PATH': ''})
              if result.returncode or result.stderr or result.stdout != compiler_bytes:
                  raise RuntimeError('standalone native compiler did not reproduce itself')
              previous = output / ('native-compiler-rebuilt-' + str(generation))
              previous.write_bytes(result.stdout)
              previous.chmod(0o755)

          print(json.dumps({
              'status': 'PASS', 'hepta_commit': head,
              'compiler_source_sha256': expected_source,
              'B1_B2_B3_sha256': generations[0],
              'standalone_compiler_sha256': expected_compiler,
              'standalone_fixed_point_generations': 2,
              'B0_requires_Python_and_GNU_ld': True,
              'full_upstream_cold_qualification': False
          }, indent=2))
          PY

      - name: Expand and reproduce the HIA compiler capacity profile
        shell: bash
        run: |
          python3 -I -S -B tools/compiler-profile/adapt.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --output "$RUNNER_TEMP/hepta-profile-sources"
          python3 -I -S -B tools/compiler-profile/generate_packer.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --output "$RUNNER_TEMP/hepta-profile-sources"
          bash tools/compiler-profile/rebuild.sh \
            "$RUNNER_TEMP/hepta-compiler/native-compiler" \
            "$RUNNER_TEMP/hepta-profile-sources" \
            "$RUNNER_TEMP/hepta-expanded"
          python3 -I -S -B tools/compiler-profile/check_capacity.py \
            --compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --output "$RUNNER_TEMP/hepta-capacity-review"
          python3 -I -S -B - <<'PROFILE'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          temporary = Path(os.environ['RUNNER_TEMP'])
          profile = json.loads(Path('compatibility/hia-expanded-profile.json').read_text())
          recorded = json.loads(Path('validation/compiler-profile.json').read_text())
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          legacy = temporary / 'hepta-compiler/native-compiler'
          expanded = temporary / 'hepta-expanded/hia-native-compiler'
          generated = temporary / 'hepta-profile-sources'
          assert digest(expanded) == profile['generated']['native_compiler']['sha256']
          assert json.loads((generated / 'adaptation.json').read_text()) == recorded['source_adaptation']
          assert json.loads((generated / 'packer-authoring.json').read_text()) == recorded['packer_authoring']
          # The original 128-function compiler cannot compile the current
          # runtime. Keep its byte witness at the exact previously qualified main.
          historical = Path('.toolchain/heptatorch-legacy').resolve()
          historical_commit = '31d5b1483714b32254730ba56787884c5c76e2fb'
          assert subprocess.check_output(['git', '-C', str(historical), 'rev-parse', 'HEAD'], text=True).strip() == historical_commit
          historical_source = historical / 'src/heptatorch.hepta'
          historical_source_sha = '4c1d17240dd8616798e238cdd54641ee6f2e42c02635c82b3bdeea0a530b5ca5'
          historical_image_sha = 'ecca265b088e0688df8ad963613f6bdf460efd324d0c480e6395e4ef67372779'
          assert digest(historical_source) == historical_source_sha
          comparisons = []
          for name, source_path in [('historical-runtime', historical_source), ('current-unhex', Path('tools/unhex.hepta'))]:
              source = source_path.read_bytes()
              outputs = [subprocess.run([str(compiler)], input=source, capture_output=True,
                                        timeout=30, env={'PATH': ''}) for compiler in (legacy, expanded)]
              assert all(p.returncode == 0 and not p.stderr for p in outputs)
              assert outputs[0].stdout == outputs[1].stdout
              image_sha = hashlib.sha256(outputs[0].stdout).hexdigest()
              if name == 'historical-runtime':
                  assert image_sha == historical_image_sha
              comparisons.append({'witness': name, 'source_sha256': digest(source_path),
                                  'image_sha256': image_sha, 'byte_identical': True})
          capacity = json.loads((temporary / 'hepta-capacity-review/summary.json').read_text())
          assert capacity['pass'] and capacity['passed'] == capacity['total'] == 16
          print(json.dumps({'schema': 'heptatorch.hosted-compiler-profile.v2', 'status': 'PASS',
                            'profile': profile['profile'], 'native_compiler_sha256': digest(expanded),
                            'native_fixed_point_generations': 4,
                            'adaptation_receipts_match': True,
                            'legacy_runtime_witness_commit': historical_commit,
                            'legacy_comparisons': comparisons, 'capacity_review': capacity}))
          PROFILE

      - name: Verify the pinned module adaptation inputs
        shell: bash
        run: |
          python3 -I -S -B - <<'MODULE_INPUTS'
          from pathlib import Path
          import hashlib
          import json
          recorded = json.loads(Path('validation/native-modules.json').read_text())
          assert recorded['status'] == 'PASS'
          for path, expected in recorded['packaged_tools_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          profile = json.loads(Path('tools/modules/profile.json').read_text())
          assert profile['profile'] == recorded['profile'] == 'heptatorch.hia.borrowed-modules.v1'
          assert profile['upstream_commit'] == recorded['upstream_commit'] == 'f33d8da316de8fdf27b504371f1a5310997ff548'
          print('PASS: exact module adaptation, native authoring additions and test-source pins')
          MODULE_INPUTS

      - name: Author and reproduce three native module-compiler generations
        shell: bash
        run: |
          python3 -I -S -B tools/modules/build_module_compiler.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --output "$RUNNER_TEMP/hepta-modules-sources"
          python3 -I -S -B tools/modules/build_module_linker.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --output "$RUNNER_TEMP/hepta-modules-sources"
          cp "$RUNNER_TEMP/hepta-profile-sources/compiler-packer.hepta" \
            "$RUNNER_TEMP/hepta-modules-sources/compiler-packer.hepta"
          bash tools/modules/rebuild.sh \
            "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            "$RUNNER_TEMP/hepta-modules-sources" \
            "$RUNNER_TEMP/hepta-modules-native"
          python3 -I -S -B - <<'MODULE_REPRODUCTION'
          from pathlib import Path
          import hashlib
          import json
          import os
          temporary = Path(os.environ['RUNNER_TEMP'])
          sources = temporary / 'hepta-modules-sources'
          native = temporary / 'hepta-modules-native'
          recorded = json.loads(Path('validation/native-modules.json').read_text())
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert json.loads((sources / 'compiler-adaptation.json').read_text()) == recorded['compiler_authoring']
          assert json.loads((sources / 'linker-authoring.json').read_text()) == recorded['linker_authoring']
          assert digest(native / 'module-compiler') == recorded['compiler_executable_sha256']
          assert digest(native / 'module-linker') == recorded['linker_executable_sha256']
          generations = []
          for generation in range(3):
              generations.append({'generation': generation,
                                  'flat_sha256': digest(native / ('M' + str(generation) + '.image')),
                                  'executable_sha256': digest(native / ('compiler-' + str(generation)))})
          assert generations == recorded['native_reproduction']['generations']
          print(json.dumps({'schema': 'heptatorch.hosted-module-reproduction.v1', 'status': 'PASS',
                            'profile': recorded['profile'], 'native_generations': generations,
                            'compiler_authoring_closure_files': len(recorded['compiler_authoring']['upstream_source_files_verified_before_and_after']),
                            'linker_authoring_closure_files': len(recorded['linker_authoring']['upstream_source_files_verified_before_and_after'])}))
          MODULE_REPRODUCTION

      - name: Reproduce the owned-resource ABI2 compiler and native syscall allocator
        shell: bash
        run: |
          sha256sum -c validation/owned-module-package.sha256
          python3 -I -S -B tools/owned_modules/rebuild.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --borrowed-tools "$RUNNER_TEMP/hepta-modules-native" \
            --output "$RUNNER_TEMP/hepta-owned-modules"

      - name: Reproduce checked owned-state interactive entry and cleanup tools
        shell: bash
        run: |
          sha256sum -c validation/owned-session-package.sha256
          python3 -I -S -B tools/owned_sessions/rebuild.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --owned-build "$RUNNER_TEMP/hepta-owned-modules" \
            --owned-profile tools/owned_modules/profile.json \
            --borrowed-tools "$RUNNER_TEMP/hepta-modules-native" \
            --output "$RUNNER_TEMP/hepta-owned-session-tools"

      - name: Reproduce ABI3 native stack admission and guarded startup
        id: toolchain
        run: |
          sha256sum -c validation/stack-budget-package.sha256
          python3 -I -S -B tools/stack_budget/rebuild.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --owned-build "$RUNNER_TEMP/hepta-owned-modules" \
            --session-build "$RUNNER_TEMP/hepta-owned-session-tools" \
            --borrowed-tools "$RUNNER_TEMP/hepta-modules-native" \
            --output "$RUNNER_TEMP/hepta-stack-budget"

      - name: Reproduce the native four-argument entropy linker
        id: entropy_tool
        run: |
          sha256sum -c tools/current_runtime/entropy_linker/source-pins.sha256
          python3 -I -S -B tools/current_runtime/entropy_linker/build_tool.py \
            --upstream "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --stack-build "$RUNNER_TEMP/hepta-stack-budget" \
            --output "$RUNNER_TEMP/hepta-current-entropy"
          for name in linker.hepta linker-authoring.txt startup-authoring.txt; do
            cmp "tools/current_runtime/entropy_linker/source/$name" "$RUNNER_TEMP/hepta-current-entropy/$name"
          done

      - name: Cold-build the complete canonical HIA runtime
        id: current_build
        run: |
          python3 -I -S -B tools/current_runtime/build.py \
            --manifest tools/current_runtime/source/manifest.json \
            --source-root tools/current_runtime/source \
            --compiler "$RUNNER_TEMP/hepta-stack-budget/native/stack-module-compiler" \
            --linker "$RUNNER_TEMP/hepta-current-entropy/generator-session-linker" \
            --output "$CURRENT_OUTPUT/build"
          cmp "$RUNNER_TEMP/hepta-current-entropy/generator-session-linker" "$CURRENT_OUTPUT/build/toolchain/stack-linker-session"

      - name: Install the independent pinned PyTorch CPU oracle
        id: oracle
        shell: bash
        run: |
          python3 - <<'PYTORCH_INSTALL'
          from pathlib import Path
          import json
          import platform
          import subprocess
          import sys

          lock = json.loads(Path('compatibility/pytorch-oracle-lock.json').read_text())
          expected = lock['oracle']
          if (sys.implementation.name != expected['python']['implementation']
                  or list(sys.version_info[:2]) != expected['python']['version']
                  or sys.platform != expected['platform']['sys_platform']
                  or platform.machine() != expected['platform']['machine']):
              raise RuntimeError('Pinned PyTorch oracle requires CPython 3.12 on Linux x86_64')
          report = Path(expected['install_report'])
          report.parent.mkdir(parents=True, exist_ok=True)
          wheel = expected['wheel']['url'] + '#sha256=' + expected['wheel']['sha256']
          subprocess.run([sys.executable, '-m', 'pip', 'install',
                          '--disable-pip-version-check', '--force-reinstall',
                          '--index-url', 'https://download.pytorch.org/whl/cpu',
                          '--report', str(report),
                          '-r', 'compatibility/pytorch-reference-requirements.txt',
                          wheel], check=True)
          # Missing NumPy makes this exact Torch build warn during import.
          # Verify the actual reference environment before any suite starts;
          # the original strict reference-stderr checks remain unchanged.
          preflight = subprocess.run(
              [sys.executable, '-B', '-W', 'error', '-c', 'import numpy; import torch'],
              capture_output=True, timeout=60)
          if preflight.returncode or preflight.stdout or preflight.stderr:
              raise RuntimeError('Pinned Torch reference import failed: ' +
                                 repr((preflight.returncode, preflight.stdout, preflight.stderr)))
          PYTORCH_INSTALL


      - name: Qualify all twenty-eight suites and the independent Generator probe images
        id: current_qualification
        if: ${{ !cancelled() && steps.current_build.outcome == 'success' }}
        run: |
          test ! -e src/heptatorch.hepta
          test ! -L src/heptatorch.hepta
          python3 -I -S -B tests/qualify_current_runtime.py \
            --build-directory "$CURRENT_OUTPUT/build" \
            --tool-build "$RUNNER_TEMP/hepta-current-entropy" \
            --stack-build "$RUNNER_TEMP/hepta-stack-budget" \
            --output "$CURRENT_OUTPUT/review"
          test ! -e src/heptatorch.hepta
          test ! -L src/heptatorch.hepta

      - name: Publish the actual current-runtime qualification result
        if: ${{ always() }}
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          ENTROPY_TOOL_OUTCOME: ${{ steps.entropy_tool.outcome }}
          BUILD_OUTCOME: ${{ steps.current_build.outcome }}
          ORACLE_OUTCOME: ${{ steps.oracle.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.current_qualification.outcome }}
        run: |
          export CURRENT_OUTPUT="${CURRENT_OUTPUT:-$RUNNER_TEMP/heptatorch-current}"
          python3 -I -S -B - <<'SUMMARY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import sys

          output = Path(os.environ['CURRENT_OUTPUT'])
          output.mkdir(parents=True, exist_ok=True)
          failures, qualification, binding = [], None, None
          predicate_evidence = bf16_evidence = half_mul_evidence = half_neg_evidence = half_addsub_evidence = wide_neg_evidence = half_div_evidence = public_f64_arithmetic_evidence = same_f64_arithmetic_evidence = None
          for key in ('TOOLCHAIN_OUTCOME', 'ENTROPY_TOOL_OUTCOME', 'BUILD_OUTCOME', 'ORACLE_OUTCOME', 'QUALIFICATION_OUTCOME'):
              if os.environ.get(key) != 'success':
                  failures.append(key + '=' + os.environ.get(key, 'missing'))
          try:
              raw = (output / 'review/qualification.json').read_bytes()
              qualification = json.loads(raw)
              binding = {'path': 'review/qualification.json', 'bytes': len(raw),
                         'sha256': hashlib.sha256(raw).hexdigest()}
              if qualification['status'] != 'PASS_CURRENT_RUNTIME_FOCUSED':
                  failures.append('the mandatory twenty-eight-suite qualifier did not pass')
              if (qualification['required_cases_total'] != 13075
                      or qualification['executed_cases_total'] != 13075
                      or qualification['required_suites'] != [
                      'bool27', 'original76', 'integral24', 'sum_f32_17', 'current35', 'base270', 'sum32', 'live32', 'logical147', 'resource7', 'asstrided16', 'cat4', 'metadata10', 'generator131', 'public_f64_logical192', 'f64_48', 'half47', 'half_logical264', 'half_transactions12', 'numeric_predicates', 'bf16_copy', 'half_mul', 'half_neg', 'half_addsub', 'wide_neg', 'half_div', 'public_f64_arithmetic', 'same_f64_arithmetic']):
                  failures.append('the mandatory case denominator or suite order changed')
              if (qualification['functions'] != 773 or qualification['units'] != 15
                      or qualification['source_sha256'] != '846e592beaa7847383cee668bc33d25cd81e79052bd4612252e2f72a83d96d05'
                      or qualification['native_sha256'] != '5cba6f11269f71efb319aa7368009055bb2e9b9571329daeae9bbc453287c3ad'):
                  failures.append('the same complete current773 source and image were not qualified')
              public_f64 = [row for row in qualification['suites'] if row['name'] == 'public_f64_logical192']
              if (len(public_f64) != 1 or public_f64[0]['status'] != 'PASS'
                      or public_f64[0]['qualified'] is not True or public_f64[0]['cases'] != 192
                      or public_f64[0]['native_sessions'] != 196
                      or public_f64[0]['packet_controls'] != 18 or public_f64[0]['allocation_controls'] != 2
                      or public_f64[0]['native_boundary_controls'] != 2
                      or public_f64[0]['boundary_controls_counted_as_torch_compatibility'] is not False
                      or public_f64[0]['outside_native_scope_torch_observations'] != 6
                      or public_f64[0]['original147_replaced'] is not False
                      or public_f64[0]['complete_original_reader_reapplied'] is not True
                      or public_f64[0]['complete_raw_frames_reparsed'] is not True
                      or public_f64[0]['full_owner_archives_rechecked'] is not True):
                  failures.append('the complete public F64 comparisons, controls or scope binding differ')
              for name, cases in (('f64_48', 48), ('half47', 47)):
                  rows = [row for row in qualification['suites'] if row['name'] == name]
                  if (len(rows) != 1 or rows[0]['status'] != 'PASS'
                          or rows[0]['qualified'] is not True or rows[0]['cases'] != cases
                          or rows[0]['native_sessions'] != cases):
                      failures.append(name + ': mandatory original case/process census differs')
                      continue
                  physical = rows[0]['physical_qualification']
                  proof_path = output / ('review/' + name + '/physical-qualification.json')
                  proof_raw = proof_path.read_bytes()
                  if (physical['path'] != name + '/physical-qualification.json'
                          or physical['bytes'] != len(proof_raw)
                          or physical['sha256'] != hashlib.sha256(proof_raw).hexdigest()
                          or physical['status'] != json.loads(proof_raw)['status']):
                      failures.append(name + ': complete physical qualification binding differs')
                  if name == 'f64_48' and (rows[0]['frames'] != 3259 or rows[0]['assertions'] != 17923):
                      failures.append('f64_48: original complete frame/check census differs')
                  if name == 'half47':
                      expected_entry = dict(original_entry_requests=239, original_refusals=239,
                                            retained_refusals=151, accepted_multiplication_successors=22,
                                            accepted_negation_successors=2, accepted_addsub_successors=42,
                                            accepted_division_successors=22,
                                            accepted_single_command_addsub_successors=40, accepted_FE_addsub_successors=2,
                                            accepted_addition_successors=24, accepted_subtraction_successors=18,
                                            retained_actual_Bool_subtraction_errors=4,
                                            retained_private3_addsub_protocol_refusals=8,
                                            retained_private3_division_protocol_refusals=4)
                      physical_proof = json.loads(proof_raw)
                      if (rows[0]['frames'] != 3887 or rows[0]['assertions'] != 20133
                              or rows[0]['frames'] != physical_proof['frames']
                              or rows[0]['assertions'] != physical_proof['checks']
                              or any(rows[0].get(key) != value or physical_proof.get(key) != value
                                     for key, value in expected_entry.items())):
                          failures.append('half47: complete47 census or exact239-request successor partition differs')
              for name, cases, sessions, frames, checks, owners, packets, recoveries in (
                      ('half_logical264', 264, 272, 5484, 23260, 1964, 52, 6),
                      ('half_transactions12', 12, 12, 180, 666, 72, 0, 0)):
                  rows = [row for row in qualification['suites'] if row['name'] == name]
                  if (len(rows) != 1 or rows[0]['status'] != 'PASS' or rows[0]['qualified'] is not True):
                      failures.append(name + ': mandatory current Half qualification did not pass')
                      continue
                  row = rows[0]
                  expected = dict(cases=cases, native_sessions=sessions, frames=frames,
                      assertions=checks, owner_snapshots=owners, mapping_snapshots=12 if name == 'half_transactions12' else 0,
                      additional_packet_controls=packets,
                      additional_allocation_recoveries=recoveries, physical_replay=True,
                      native_executed_by_qualifier=False, Torch_executed_by_qualifier=False,
                      historical_refusal12_rewritten=False,
                      reference_sha256='891a2081ffe8df31eb016f51d9a57ffd1d7c588fb61173e2922f080aa33bfc33')
                  if any(row.get(key) != value for key, value in expected.items()):
                      failures.append(name + ': complete comparison, control and process census differs')
                  physical = row['physical_qualification']
                  proof_raw = (output / ('review/' + name + '/physical-qualification.json')).read_bytes()
                  if (physical != dict(path=name + '/physical-qualification.json', bytes=len(proof_raw),
                                       sha256=hashlib.sha256(proof_raw).hexdigest(),
                                       status='PASS_PHYSICAL_HALF_LOGICAL')
                          or json.loads(proof_raw) != expected):
                      failures.append(name + ': independent complete frame and owner readback differs')
              # Check the exact original485 proof,496 native sessions,11244 frames,
              #42645 assertions,3615 full owners,10 mappings and every additional
              # control. Bind this run's actual Torch report/argv/streams/inputs;
              # no earlier reference-report SHA is substituted and no case is rerun.
              import importlib.util
              custody_path = Path('tools/seal_current_ci_evidence.py').resolve()
              custody_spec = importlib.util.spec_from_file_location('current_predicate_custody', custody_path)
              custody_module = importlib.util.module_from_spec(custody_spec)
              custody_spec.loader.exec_module(custody_module)
              predicate_evidence, predicate_inputs = custody_module.numeric_predicate_custody(
                  Path.cwd().resolve(), output.resolve())
              bf16_evidence, bf16_inputs = custody_module.bf16_copy_custody(
                  Path.cwd().resolve(), output.resolve())
              half_mul_evidence, half_mul_inputs = custody_module.half_mul_custody(
                  Path.cwd().resolve(), output.resolve())
              half_neg_evidence, half_neg_inputs = custody_module.half_neg_custody(
                  Path.cwd().resolve(), output.resolve())
              half_addsub_evidence, half_addsub_inputs = custody_module.half_addsub_custody(
                  Path.cwd().resolve(), output.resolve())
              wide_neg_evidence, wide_neg_inputs = custody_module.wide_neg_custody(
                  Path.cwd().resolve(), output.resolve())
              half_div_evidence, half_div_inputs = custody_module.half_div_custody(
                  Path.cwd().resolve(), output.resolve())
              public_f64_arithmetic_evidence, public_f64_arithmetic_inputs = custody_module.public_f64_arithmetic_custody(
                  Path.cwd().resolve(), output.resolve())
              same_f64_arithmetic_evidence, same_f64_arithmetic_inputs = custody_module.same_f64_arithmetic_custody(
                  Path.cwd().resolve(), output.resolve())
              if (qualification['full_pytorch_rewrite_complete'] is not False
                      or qualification['schema_closure'] is not False
                      or qualification['full_project_status'] != 'HOLD'):
                  failures.append('the finite current gate must preserve whole-project HOLD')
              if qualification['all_suites_executed'] is not True or qualification['all_inputs_unchanged'] is not True:
                  failures.append('actual execution or input custody incomplete')
          except Exception as error:
              failures.append('missing or incomplete qualification evidence: ' + repr(error))
          entropy_binding = None
          try:
              entropy_path = Path(os.environ['RUNNER_TEMP']) / 'hepta-current-entropy/build.json'
              raw = entropy_path.read_bytes()
              entropy = json.loads(raw)
              entropy_binding = {'path': 'toolchain/hepta-current-entropy/build.json',
                                 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              if (entropy['schema'] != 'heptatorch.generator-entropy-linker.tool-only-build.v1'
                      or entropy['status'] != 'PASS_NATIVE_ENTROPY_LINKER_BUILD_ONLY'
                      or len(entropy['inputs']) != 40 or len(entropy['processes']) != 2
                      or entropy['all_inputs_unchanged'] is not True
                      or entropy['compiler_executed'] is not True or entropy['tool_linker_executed'] is not True
                      or entropy['generator_session_linker_executed'] is not False
                      or entropy['old_generator_application_built'] is not False
                      or entropy['old_generator_application_executed'] is not False):
                  failures.append('the complete original two-process entropy-tool receipt did not pass')
              if any(p['exit_code'] != 0 or not p['stdout_EOF'] or not p['stderr_EOF']
                     or p['timed_out'] or p['stderr_bytes'] != 0 for p in entropy['processes']):
                  failures.append('entropy tool compilation/linking streams did not close successfully')
              if (entropy['compiler_sha256'] != 'b1c851a0896fa6071f800e1146c3c27d0c6cf85059e9a6281b46d42908a3f59f'
                      or entropy['entropy_linker_sha256'] != '761a941fd7a2d53eb9b45869fcfc20e970640e9dd11d60f7c61a89812b61d74e'
                      or entropy['entropy_linker_source_sha256'] != '7bba866ece4f33fb6b1973e33475d868376f2b804d5ce81116cf206cfff31c34'):
                  failures.append('the fixed native entropy tool source/compiler/product identities differ')
              if (qualification is not None
                      and qualification['entropy_tool_build']['sha256'] != entropy_binding['sha256']):
                  failures.append('Generator131 did not bind this actual entropy-tool build receipt')
          except Exception as error:
              failures.append('missing or incomplete entropy tool evidence: ' + repr(error))
          summary = {'schema': 'heptatorch.current-runtime.focused-ci.v1',
                     'status': 'PASS_CURRENT_RUNTIME_FOCUSED' if not failures else 'FAIL',
                     'commit': os.environ.get('GITHUB_SHA'),
                     'hepta_commit': 'f33d8da316de8fdf27b504371f1a5310997ff548',
                     'qualification': binding, 'entropy_tool_build': entropy_binding,
                     'numeric_predicates_evidence': predicate_evidence,
                     'bf16_copy_evidence': bf16_evidence, 'half_mul_evidence': half_mul_evidence,
                     'half_neg_evidence': half_neg_evidence, 'half_addsub_evidence': half_addsub_evidence,
                     'wide_neg_evidence': wide_neg_evidence,
                     'half_div_evidence': half_div_evidence,
                     'public_f64_arithmetic_evidence': public_f64_arithmetic_evidence,
                     'same_f64_arithmetic_evidence': same_f64_arithmetic_evidence,
                     'failures': failures,
                     'full_pytorch_rewrite_complete': False, 'full_project_status': 'HOLD'}
          (output / 'qualification.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('## Current HIA runtime\n\n' + summary['status'] + '\n\n')
              stream.write('The common local/CI gate requires one complete main cold build and all 13075 finite cases: '
                           'Bool27, view/scalar76, Integral24, explicit-F32 Sum17, lifecycle35, '
                           'base/NN270, original F32 Sum32, live Tensor/RNG/backward32, logical147, resource7, original AsStrided16, Cat4, cat metadata10, Generator131, public F64 logical192, original F64 48, Half47, Half logical264, Half transactions12, numeric predicates485, BF16 copy280, Half multiplication312, Half negation371, Half addition/subtraction1006, I64/F64 negation405, Half true division1196, mixed public F64 arithmetic2541 and same public F64 arithmetic5088. '
                           'Every suite must execute and pass. Generator131 additionally links and executes separate '
                           'current-object ABI and reordered probe images; these are not the main executable.\n\n')
              stream.write('Current controls include seven dtype cases, four axis errors, ten entry checks, '
                           'both F32 allocation stages, the original Bool allocation case, '
                           'four positive and nineteen negative owner controls, and fourteen real '
                           'same-process prefix/refusal pairs. Original Bool and Integral reports '
                           'retain their exact expected-refusal FAIL results; their explicit changes '
                           'are admitted separately and the current dtype contract is independently tested.\n\n')
              stream.write('Lifecycle35, base/NN270, live32 and the original Generator24 subset run the fixed live Torch reference. '
                           'Frozen-reference suites retain their original observed bytes; Cat4 consumes four fixed legacy packet fixtures. The new Half groups cover independent actual Torch results and successful/failed transactions. '
                           'Logical147 also requires nineteen packet controls and two actual '
                           'allocation/rollback/retry controls. Resource7 retains all original '
                           'R4 resource3, backward-private-cache1 and R3 preserve3 recipes, '
                           'including three actual allocation-limit restorations. AsStrided16 preserves all four original '
                           'suites and checks 1,920 observed frames, sixteen native process exits '
                           'and both output EOFs for every process. Cat4 independently rereads three complete original '
                           'successful response byte streams and one expanded-capacity control, with four native exits, '
                           'eight physical owner observations and both EOFs for every process. Its old overflow '
                           'refusal fixture remains an unqualified historical failure reference. Cat metadata10 retains the exact '
                           'fixed Torch recipes and unshifted gradient versions; its passive original-method observations '
                           'bind full physical owner bytes, all original command frames, ten actual exits and twenty native EOFs. '
                           'Generator131 preserves original24, native11, entry59 and dispatch37, complete Tensor/Generator owners, '
                           'real entropy, current-object ABI and reordered links, exact controls and actual process EOFs.\n\n')
              stream.write('Public F64 logical192 keeps all original 192 dense no-gradient comparisons, eighteen packet '
                           'controls, two actual allocation rollback/retry controls and 196 complete native exits. '
                           'Its two additional native scope controls and six outside-scope Torch observations are '
                           'retained separately and are not counted as Torch compatibility. Logical147 remains required.\n\n')
              stream.write('Original F64 48 preserves 33 numeric, twelve boundary, one entry and two allocation '
                           'recipes, including all 87 original requests:63 refusals, one exact negation and23 mixed arithmetic successors, including one original FE request. Half47 preserves 26 numeric recipes, '
                           'sixteen boundaries, all 239 original entry requests and four allocation rollback/retry recipes. '
                           'Exactly22 original multiplications, two negations,42 additions/subtractions and22 true divisions require fresh actual Torch result bytes, '
                           'including two same-frame FE operations; the other151 remain refusals and historical239 evidence remains unchanged. '
                           'Half logical264 retains 222 actual successes and 42 actual errors, all 65,536 encodings per dtype, '
                           '52 packet controls and six real allocation recoveries. Half transactions12 checks six direct '
                           'successes and six invalid-suffix rollback cases with full owner, RNG and mapping equality. '
                           'The original refusal12 records remain historical. Their physical qualifiers '
                           'reopen every raw frame, complete owner archive, source input and actual exit/EOF. '
                           'BF16 copy280 compares 1,312,796 result elements bit for bit against a fresh fixed-wheel Torch process, '
                           'then replays 6,088 physical frames, 23,096 assertions and 1,960 complete owner snapshots. '
                           'Half multiplication312 requires an explicit AVX2 single-thread pinned Torch reference, '
                           '1,313,608 bitwise elements, 9,696 physical frames, 37,314 assertions and 2,878 full owners; '
                           'four old arithmetic refusals use the same current1006 Torch reference, and two division controls use the shared1196 reference. '
                           'Half negation371 requires272,444 bitwise elements,11,377 physical frames,37,744 assertions,2,717 full owners, '
                           '46 packet controls and two real allocation failures with identical-request recovery. '
                           'Half addition/subtraction1006 requires an independent AVX2 single-thread fixed-wheel reference, '
                           '31,532 physical frames,120,134 assertions,9,186 full owners, four actual allocation recoveries and70 protocol controls. '
                           'Forty original single-command results, two same-frame FE results, four actual Bool subtraction errors '
                           'and eight private-dtype protocol refusals are kept distinct. '
                           'I64/F64 negation405 binds287,275 exact result elements,10,484 frames,37,314 assertions, '
                           '2,959 full owners,46 protocol controls and2 actual allocation recoveries. '
                           'The same actual405 reference also validates the original F64 negation request. '
                           'Half true division1196 binds2,250,592 exact result elements,38,348 frames,144,654 assertions, '
                           '10,816 full owners,32 protocol controls and2 actual allocation recoveries. The exact same newly executed1196 reference '
                           'validates its own cases,22 original Half47 requests, two multiplication controls and four addition/subtraction controls. '
                           'Mixed public F64 arithmetic2541 binds460,792 exact result elements,80,200 frames,304,449 assertions, '
                           '22,960 full owners,82 protocol controls and4 actual allocation recoveries. The same actual2541 reference '
                           'also validates22 original single commands and one original FE request; both Bool subtraction refusals remain. '
                           'Same-F64 NaN payload parity is still open. '
                           'Historical reference argv/interpreter gaps remain explicit; the current CI interpreter '
                           'does not replace a historical reference producer.\n\n')
              stream.write('Numeric predicates485 observes isnan/isinf/isfinite/isposinf/isneginf with a newly '
                           'executed fixed Torch reference. All496 native sessions and11244 frames retain42645 '
                           'assertions,3615 complete owner snapshots and10 complete mapping snapshots. '
                           'The56 packet controls, five successful and five failed same-frame transactions, '
                           'and five genuine allocation-refusal/restoration cases remain separate controls. '
                           'Its physical proof binds this run’s reference report, exact argv/interpreter, '
                           'both original process streams and every original reference input. This custody '
                           'check does not execute or numerically readmit cases.\n\n')
              stream.write('Full PyTorch rewrite: HOLD. This finite gate does not assert project closure.\n')
              if qualification:
                  for suite in qualification.get('suites', []):
                      stream.write('\n- ' + suite['name'] + ': ' + suite['status'] + '\n')
              for failure in failures:
                  stream.write('\n- ' + failure + '\n')
          sys.exit(1 if failures else 0)
          SUMMARY

      - name: Preserve complete original evidence and file modes after success or failure
        if: ${{ always() }}
        run: |
          export CURRENT_OUTPUT="${CURRENT_OUTPUT:-$RUNNER_TEMP/heptatorch-current}"
          custody_exit_code=0
          python3 -I -S -B tools/seal_current_ci_evidence.py \
            --repository "$GITHUB_WORKSPACE" \
            --current-output "$CURRENT_OUTPUT" \
            --toolchain-root "$RUNNER_TEMP" \
            --source-commit "$GITHUB_SHA" \
            --output-prefix "$RUNNER_TEMP/heptatorch-current-evidence" \
            > "$RUNNER_TEMP/heptatorch-current-evidence.sealer.stdout" \
            2> "$RUNNER_TEMP/heptatorch-current-evidence.sealer.stderr" || custody_exit_code=$?
          printf '%s\n' "$custody_exit_code" > "$RUNNER_TEMP/heptatorch-current-evidence.sealer-exit-code"
          exit "$custody_exit_code"

      - name: Upload complete current runtime native evidence
        id: evidence_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-runtime-native-evidence
          path: |
            ${{ runner.temp }}/heptatorch-current-evidence.tar.xz
            ${{ runner.temp }}/heptatorch-current-evidence.manifest.json
            ${{ runner.temp }}/heptatorch-current-evidence.custody.json
            ${{ runner.temp }}/heptatorch-current-evidence.sha256
            ${{ runner.temp }}/heptatorch-current-evidence.sealer.stdout
            ${{ runner.temp }}/heptatorch-current-evidence.sealer.stderr
            ${{ runner.temp }}/heptatorch-current-evidence.sealer-exit-code
            ${{ runner.temp }}/heptatorch-current/qualification.json
          if-no-files-found: error
          # Compress JSON manifests and reports while retaining all archive bytes.
          compression-level: 9
          retention-days: 30

      - name: Plan lossless transfer of the official original artifact ZIP
        id: transport_plan
        if: ${{ always() && steps.evidence_upload.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          ORIGINAL_ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          python3 -I -S -B tools/ci_artifact_transport.py plan \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --event-name "$GITHUB_EVENT_NAME" \
            --checkout-sha "$GITHUB_SHA" --pull-request-head-sha "$PR_HEAD_SHA" \
            --artifact-id "$ORIGINAL_ARTIFACT_ID" --artifact-digest "$ORIGINAL_ARTIFACT_DIGEST" \
            --output-directory "$RUNNER_TEMP/current-evidence-transport-plan" \
            --github-output "$GITHUB_OUTPUT"

  original-evidence-zip-transport:
    name: Original evidence ZIP part ${{ matrix.part }}
    needs: current-runtime
    if: ${{ always() && needs.current-runtime.outputs.transport-parts != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ${{ fromJSON(needs.current-runtime.outputs.transport-parts || '[]') }}
    steps:
      - name: Check out the exact original transport helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: tools/ci_artifact_transport.py

      - name: Verify the complete official ZIP and retain one exact interval
        id: transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_ARTIFACT_ID: ${{ needs.current-runtime.outputs.evidence-artifact-id }}
          ORIGINAL_ARTIFACT_DIGEST: ${{ needs.current-runtime.outputs.evidence-artifact-digest }}
          ORIGINAL_ARTIFACT_BYTES: ${{ needs.current-runtime.outputs.evidence-artifact-bytes }}
          ORIGINAL_REST_HEAD_SHA: ${{ needs.current-runtime.outputs.evidence-rest-head-sha }}
          ORIGINAL_RUN_ATTEMPT: ${{ needs.current-runtime.outputs.evidence-run-attempt }}
          ORIGINAL_HELPER_SHA256: ${{ needs.current-runtime.outputs.transport-helper-sha256 }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PART_INDEX: ${{ matrix.part }}
        run: |
          python3 -I -S -B tools/ci_artifact_transport.py chunk \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$ORIGINAL_RUN_ATTEMPT" --transport-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --checkout-sha "$GITHUB_SHA" --pull-request-head-sha "$PR_HEAD_SHA" \
            --expected-run-head-sha "$ORIGINAL_REST_HEAD_SHA" --helper-sha256 "$ORIGINAL_HELPER_SHA256" \
            --artifact-id "$ORIGINAL_ARTIFACT_ID" --artifact-digest "$ORIGINAL_ARTIFACT_DIGEST" \
            --artifact-bytes "$ORIGINAL_ARTIFACT_BYTES" --index "$PART_INDEX" \
            --output-directory "$RUNNER_TEMP/current-evidence-zip-part" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload the exact ZIP interval and complete inventory
        if: ${{ always() && steps.transport.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.transport.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/current-evidence-zip-part/original.zip.part-*
            ${{ runner.temp }}/current-evidence-zip-part/transport-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

