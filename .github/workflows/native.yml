name: Native HIA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out HeptaTorch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned HIA toolchain sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TrillionniumFoundation/Hepta
          ref: f33d8da316de8fdf27b504371f1a5310997ff548
          path: .toolchain/hepta
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            hepta
            tools
            examples/hia_bootstrap
            docs

      - name: Check out the fixed historical legacy-compiler witness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: TrillionniumFoundation/HeptaTorch
          ref: 31d5b1483714b32254730ba56787884c5c76e2fb
          path: .toolchain/heptatorch-legacy
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            src

      - name: Check that the complete upstream target remains recorded
        run: |
          python3 -I -S -B tools/check_acceptance.py
          python3 -I -S -B tests/check_acceptance_negative.py
          python3 -I -S -B tests/check_session_reports.py sources

      - name: Bootstrap and reproduce the native HIA compiler
        shell: bash
        run: |
          python3 -I -S -B - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          import sys

          root = Path('.toolchain/hepta').resolve()
          output = Path(os.environ['RUNNER_TEMP']) / 'hepta-compiler'
          output.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(root))
          from tools.qualify_hia_selfhost import build_seed, compile_stage

          expected_commit = 'f33d8da316de8fdf27b504371f1a5310997ff548'
          expected_source = '388b182e42675f11435867dd99520e9452a4ff48e23c0766a3952b662acc7627'
          expected_compiler = '87c247e4d1c3c9a449d2947fd4227fdc186d519bffd203a04cafce7861a4ed54'
          head = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          if head != expected_commit:
              raise RuntimeError('unexpected HIA source commit')
          source = (root / 'examples/hia_bootstrap/selfhost.hepta').read_bytes()
          if hashlib.sha256(source).hexdigest() != expected_source:
              raise RuntimeError('unexpected HIA compiler source digest')

          # B0 is the external bootstrap boundary: Python assembler and GNU ld.
          # B1 onward are compiled by preceding HIA machine code. The upstream
          # stdlib child transports fixed ABI buffers; it does not compile them.
          image, seed = build_seed(output, source)
          generations = []
          for label in ('B1', 'B2', 'B3'):
              image, receipt = compile_stage(
                  output, label, image, source,
                  image_format='seed-shared' if label == 'B1' else 'flat-x86-64')
              generations.append(receipt['produced_sha256'])
          if len(set(generations)) != 1:
              raise RuntimeError('B1/B2/B3 compiler images differ')

          old = b'hia-asm.v1 hepta.hia.program.v8 selfhost\n'
          new = b'hia-asm.v1 hepta.hia.program.v8 selfhost_exec\n'
          if not source.startswith(old):
              raise RuntimeError('unexpected compiler module header')
          executable_source = new + source[len(old):]
          compiler, receipt = compile_stage(
              output, 'native-compiler', image, executable_source,
              output_extension='')
          compiler.chmod(0o755)
          compiler_bytes = compiler.read_bytes()
          if hashlib.sha256(compiler_bytes).hexdigest() != expected_compiler:
              raise RuntimeError('unexpected native compiler digest')

          # The standalone compiler performs two further rebuilds with no PATH.
          previous = compiler
          for generation in (1, 2):
              result = subprocess.run(
                  [str(previous)], input=executable_source, capture_output=True,
                  timeout=20, env={'PATH': ''})
              if result.returncode or result.stderr or result.stdout != compiler_bytes:
                  raise RuntimeError('standalone native compiler did not reproduce itself')
              previous = output / ('native-compiler-rebuilt-' + str(generation))
              previous.write_bytes(result.stdout)
              previous.chmod(0o755)

          print(json.dumps({
              'status': 'PASS', 'hepta_commit': head,
              'compiler_source_sha256': expected_source,
              'B1_B2_B3_sha256': generations[0],
              'standalone_compiler_sha256': expected_compiler,
              'standalone_fixed_point_generations': 2,
              'B0_requires_Python_and_GNU_ld': True,
              'full_upstream_cold_qualification': False
          }, indent=2))
          PY

      - name: Expand and reproduce the HIA compiler capacity profile
        shell: bash
        run: |
          python3 -I -S -B tools/compiler-profile/adapt.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --output "$RUNNER_TEMP/hepta-profile-sources"
          python3 -I -S -B tools/compiler-profile/generate_packer.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --output "$RUNNER_TEMP/hepta-profile-sources"
          bash tools/compiler-profile/rebuild.sh \
            "$RUNNER_TEMP/hepta-compiler/native-compiler" \
            "$RUNNER_TEMP/hepta-profile-sources" \
            "$RUNNER_TEMP/hepta-expanded"
          python3 -I -S -B tools/compiler-profile/check_capacity.py \
            --compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --output "$RUNNER_TEMP/hepta-capacity-review"
          python3 -I -S -B - <<'PROFILE'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess
          temporary = Path(os.environ['RUNNER_TEMP'])
          profile = json.loads(Path('compatibility/hia-expanded-profile.json').read_text())
          recorded = json.loads(Path('validation/compiler-profile.json').read_text())
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          legacy = temporary / 'hepta-compiler/native-compiler'
          expanded = temporary / 'hepta-expanded/hia-native-compiler'
          generated = temporary / 'hepta-profile-sources'
          assert digest(expanded) == profile['generated']['native_compiler']['sha256']
          assert json.loads((generated / 'adaptation.json').read_text()) == recorded['source_adaptation']
          assert json.loads((generated / 'packer-authoring.json').read_text()) == recorded['packer_authoring']
          # The original 128-function compiler cannot compile the current
          # runtime. Keep its byte witness at the exact previously qualified main.
          historical = Path('.toolchain/heptatorch-legacy').resolve()
          historical_commit = '31d5b1483714b32254730ba56787884c5c76e2fb'
          assert subprocess.check_output(['git', '-C', str(historical), 'rev-parse', 'HEAD'], text=True).strip() == historical_commit
          historical_source = historical / 'src/heptatorch.hepta'
          historical_source_sha = '4c1d17240dd8616798e238cdd54641ee6f2e42c02635c82b3bdeea0a530b5ca5'
          historical_image_sha = 'ecca265b088e0688df8ad963613f6bdf460efd324d0c480e6395e4ef67372779'
          assert digest(historical_source) == historical_source_sha
          comparisons = []
          for name, source_path in [('historical-runtime', historical_source), ('current-unhex', Path('tools/unhex.hepta'))]:
              source = source_path.read_bytes()
              outputs = [subprocess.run([str(compiler)], input=source, capture_output=True,
                                        timeout=30, env={'PATH': ''}) for compiler in (legacy, expanded)]
              assert all(p.returncode == 0 and not p.stderr for p in outputs)
              assert outputs[0].stdout == outputs[1].stdout
              image_sha = hashlib.sha256(outputs[0].stdout).hexdigest()
              if name == 'historical-runtime':
                  assert image_sha == historical_image_sha
              comparisons.append({'witness': name, 'source_sha256': digest(source_path),
                                  'image_sha256': image_sha, 'byte_identical': True})
          capacity = json.loads((temporary / 'hepta-capacity-review/summary.json').read_text())
          assert capacity['pass'] and capacity['passed'] == capacity['total'] == 16
          print(json.dumps({'schema': 'heptatorch.hosted-compiler-profile.v2', 'status': 'PASS',
                            'profile': profile['profile'], 'native_compiler_sha256': digest(expanded),
                            'native_fixed_point_generations': 4,
                            'adaptation_receipts_match': True,
                            'legacy_runtime_witness_commit': historical_commit,
                            'legacy_comparisons': comparisons, 'capacity_review': capacity}))
          PROFILE

      - name: Verify the pinned module adaptation inputs
        shell: bash
        run: |
          python3 -I -S -B - <<'MODULE_INPUTS'
          from pathlib import Path
          import hashlib
          import json
          recorded = json.loads(Path('validation/native-modules.json').read_text())
          assert recorded['status'] == 'PASS'
          for path, expected in recorded['packaged_tools_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          profile = json.loads(Path('tools/modules/profile.json').read_text())
          assert profile['profile'] == recorded['profile'] == 'heptatorch.hia.borrowed-modules.v1'
          assert profile['upstream_commit'] == recorded['upstream_commit'] == 'f33d8da316de8fdf27b504371f1a5310997ff548'
          print('PASS: exact module adaptation, native authoring additions and test-source pins')
          MODULE_INPUTS

      - name: Author and reproduce three native module-compiler generations
        shell: bash
        run: |
          python3 -I -S -B tools/modules/build_module_compiler.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --output "$RUNNER_TEMP/hepta-modules-sources"
          python3 -I -S -B tools/modules/build_module_linker.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --output "$RUNNER_TEMP/hepta-modules-sources"
          cp "$RUNNER_TEMP/hepta-profile-sources/compiler-packer.hepta" \
            "$RUNNER_TEMP/hepta-modules-sources/compiler-packer.hepta"
          bash tools/modules/rebuild.sh \
            "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            "$RUNNER_TEMP/hepta-modules-sources" \
            "$RUNNER_TEMP/hepta-modules-native"
          python3 -I -S -B - <<'MODULE_REPRODUCTION'
          from pathlib import Path
          import hashlib
          import json
          import os
          temporary = Path(os.environ['RUNNER_TEMP'])
          sources = temporary / 'hepta-modules-sources'
          native = temporary / 'hepta-modules-native'
          recorded = json.loads(Path('validation/native-modules.json').read_text())
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert json.loads((sources / 'compiler-adaptation.json').read_text()) == recorded['compiler_authoring']
          assert json.loads((sources / 'linker-authoring.json').read_text()) == recorded['linker_authoring']
          assert digest(native / 'module-compiler') == recorded['compiler_executable_sha256']
          assert digest(native / 'module-linker') == recorded['linker_executable_sha256']
          generations = []
          for generation in range(3):
              generations.append({'generation': generation,
                                  'flat_sha256': digest(native / ('M' + str(generation) + '.image')),
                                  'executable_sha256': digest(native / ('compiler-' + str(generation)))})
          assert generations == recorded['native_reproduction']['generations']
          print(json.dumps({'schema': 'heptatorch.hosted-module-reproduction.v1', 'status': 'PASS',
                            'profile': recorded['profile'], 'native_generations': generations,
                            'compiler_authoring_closure_files': len(recorded['compiler_authoring']['upstream_source_files_verified_before_and_after']),
                            'linker_authoring_closure_files': len(recorded['linker_authoring']['upstream_source_files_verified_before_and_after'])}))
          MODULE_REPRODUCTION

      - name: Compile and natively link the complete current runtime as modules
        shell: bash
        run: |
          python3 -I -S -B tools/modules/split_runtime.py \
            --source src/heptatorch.hepta --output "$RUNNER_TEMP/hepta-runtime-units"
          bash tools/modules/compile_link.sh \
            "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            "$RUNNER_TEMP/hepta-modules-native/module-linker" \
            "$RUNNER_TEMP/hepta-runtime-native" entry \
            "$RUNNER_TEMP/hepta-runtime-units/ht_runtime.hepta" \
            "$RUNNER_TEMP/hepta-runtime-units/ht_kernel.hepta"
          python3 -I -S -B tools/modules/tests/equivalence.py \
            --baseline-compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --module-compiler "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            --output "$RUNNER_TEMP/hepta-module-review/ordinary" \
            src/heptatorch.hepta tools/unhex.hepta

      - name: Exercise native module contracts, alias lifetimes and guarded ABI
        shell: bash
        run: |
          python3 -I -S -B tools/modules/tests/boundaries.py \
            --compiler "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            --linker "$RUNNER_TEMP/hepta-modules-native/module-linker" \
            --legacy-compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --output "$RUNNER_TEMP/hepta-module-review/boundaries"
          python3 -I -S -B tools/modules/tests/contracts.py \
            --compiler "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            --linker "$RUNNER_TEMP/hepta-modules-native/module-linker" \
            --output "$RUNNER_TEMP/hepta-module-review/contracts"
          python3 -I -S -B tools/modules/tests/capabilities.py \
            --compiler "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            --linker "$RUNNER_TEMP/hepta-modules-native/module-linker" \
            --output "$RUNNER_TEMP/hepta-module-review/capabilities"
          python3 -I -S -B tools/modules/tests/abi.py \
            --compiler-image "$RUNNER_TEMP/hepta-modules-native/M2.image" \
            --linker-image "$RUNNER_TEMP/hepta-modules-native/module-linker.image" \
            --boundary-output "$RUNNER_TEMP/hepta-module-review/boundaries" \
            --runtime-request "$RUNNER_TEMP/hepta-runtime-native/link-request.bin" \
            --runtime-executable "$RUNNER_TEMP/hepta-runtime-native/application" \
            --output "$RUNNER_TEMP/hepta-module-review/abi"
          python3 -I -S -B - <<'MODULE_GATES'
          from pathlib import Path
          import hashlib
          import json
          import os
          temporary = Path(os.environ['RUNNER_TEMP'])
          review = temporary / 'hepta-module-review'
          recorded = json.loads(Path('validation/native-modules.json').read_text())
          suites = [('boundary_tests', 'boundaries/report.json', 69),
                    ('independent_contract_tests', 'contracts/report.json', 204),
                    ('independent_capability_tests', 'capabilities/external-capability-review.json', 19),
                    ('guarded_flat_abi_tests', 'abi/report.json', 18)]
          results = []
          for key, relative, count in suites:
              observed = json.loads((review / relative).read_text())
              assert observed['status'] == 'PASS'
              assert observed['cases'] == recorded['suite_counts'][key] == count
              assert all(row['status'] == 'PASS' for row in observed['rows'])
              assert {row['case'] for row in observed['rows']} == {row['case'] for row in recorded['reports'][key]['rows']}
              results.append({'suite': key, 'cases': count, 'status': 'PASS'})
          partition = json.loads((temporary / 'hepta-runtime-units/split-manifest.json').read_text())
          assert partition == recorded['current_runtime']['source_partition']
          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          native = temporary / 'hepta-runtime-native'
          assert digest(native / 'application') == recorded['current_runtime']['linked_executable_sha256']
          assert digest(native / 'link-request.bin') == recorded['current_runtime']['link_request_sha256']
          for index, expected in enumerate(recorded['current_runtime']['objects']):
              assert digest(native / ('unit-' + str(index) + '.o')) == expected['object_sha256']
          ordinary = json.loads((review / 'ordinary/report.json').read_text())
          assert ordinary == recorded['reports']['ordinary_mode_equivalence']
          print(json.dumps({'schema': 'heptatorch.hosted-native-module-gates.v1', 'status': 'PASS',
                            'source_sha256': partition['source_sha256'], 'suites': results,
                            'complete_source_partition_identical': True,
                            'linked_executable_sha256': digest(native / 'application'),
                            'current_complete_source_and_unhex_byte_identical': True}))
          MODULE_GATES

      - name: Build and test native-linked and monolithic HIA runtimes
        shell: bash
        run: |
          make legacy monolithic \
            HEPTA_COMPILER="$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            HEPTA_MODULE_COMPILER="$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            HEPTA_MODULE_LINKER="$RUNNER_TEMP/hepta-modules-native/module-linker"
          cmp build/heptatorch "$RUNNER_TEMP/hepta-runtime-native/application"
          make test-legacy \
            HEPTA_COMPILER="$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            HEPTA_MODULE_COMPILER="$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            HEPTA_MODULE_LINKER="$RUNNER_TEMP/hepta-modules-native/module-linker" | tee build/native-linked-fixtures.log
          make test-monolithic \
            HEPTA_COMPILER="$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            HEPTA_MODULE_COMPILER="$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            HEPTA_MODULE_LINKER="$RUNNER_TEMP/hepta-modules-native/module-linker" | tee build/monolithic-fixtures.log
          python3 -I -S -B - <<'MANIFEST'
          import hashlib
          import json
          import os
          from pathlib import Path

          digest = lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest = json.loads(Path('validation/fixture-manifest.json').read_text())
          evidence = json.loads(Path('validation/native-modules.json').read_text())
          assert manifest['source_sha256'] == digest('src/heptatorch.hepta') == evidence['current_runtime']['source_partition']['source_sha256']
          assert manifest['executables_sha256']['linked'] == digest('build/heptatorch') == evidence['current_runtime']['linked_executable_sha256']
          assert manifest['executables_sha256']['monolithic'] == digest('build/heptatorch-monolithic')
          ordinary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hepta-module-review/ordinary/report.json').read_text())
          assert ordinary['rows'][0]['image_sha256'] == digest('build/heptatorch-monolithic')
          assert ordinary['rows'][1]['image_sha256'] == digest('build/unhex')
          paths = {entry['path'] for entry in manifest['files']}
          assert len(paths) == len(manifest['files'])
          assert paths == {str(p) for p in Path('tests/fixtures').glob('*.hex')}
          assert manifest['fixture_pairs'] == len(paths) // 2 == 461
          assert evidence['reports']['current_runtime_fixtures']['cases'] == 461
          for entry in manifest['files']:
              assert Path(entry['path']).stat().st_size == entry['bytes']
              assert digest(entry['path']) == entry['sha256']
          for mode in ('native-linked', 'monolithic'):
              log = Path('build/' + mode + '-fixtures.log').read_text()
              assert 'PASS: 461 native packet regression fixtures' in log
          print(json.dumps({'schema': 'heptatorch.hosted-dual-build-fixtures.v1', 'status': 'PASS',
                            'source_sha256': manifest['source_sha256'], 'fixture_pairs_per_build': 461,
                            'native_linked_sha256': digest('build/heptatorch'),
                            'monolithic_sha256': digest('build/heptatorch-monolithic')}))
          MANIFEST

      - name: Reproduce native session flat linker and wide packer
        shell: bash
        run: |
          python3 -I -S -B tools/session/build_flat_linker.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --output "$RUNNER_TEMP/hepta-session-generated/flat"
          python3 -I -S -B tools/session/build_packer.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --output "$RUNNER_TEMP/hepta-session-generated/packer"
          python3 -I -S -B tools/session/rebuild_flat_linker.py \
            --compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --module-compiler "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            --generated "$RUNNER_TEMP/hepta-session-generated/flat" \
            --output "$RUNNER_TEMP/hepta-session-native/flat"
          python3 -I -S -B tools/session/rebuild_packer.py \
            --compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --module-compiler "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            --generated "$RUNNER_TEMP/hepta-session-generated/packer" \
            --output "$RUNNER_TEMP/hepta-session-native/packer"

      - name: Qualify flat linking and actual native session capacity
        shell: bash
        run: |
          python3 -I -S -B tools/session/tests/flat_linker.py \
            --native-dir "$RUNNER_TEMP/hepta-session-native/flat" \
            --generated-dir "$RUNNER_TEMP/hepta-session-generated/flat" \
            --prior-review-dir "$RUNNER_TEMP/hepta-module-review/boundaries" \
            --prior-report "$RUNNER_TEMP/hepta-module-review/boundaries/report.json" \
            --abi-observer tools/modules/tests/observe_flat.py \
            --output "$RUNNER_TEMP/hepta-session-review/flat"
          python3 -I -S -B tools/session/tests/packer.py \
            --executable "$RUNNER_TEMP/hepta-session-native/packer/session-packer" \
            --image "$RUNNER_TEMP/hepta-session-native/packer/session-packer.image" \
            --generated "$RUNNER_TEMP/hepta-session-generated/packer" \
            --output "$RUNNER_TEMP/hepta-session-review/packer"
          python3 -I -S -B tools/session/tests/modular_capacity.py \
            --compiler "$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            --legacy-compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --flat-linker "$RUNNER_TEMP/hepta-session-native/flat/flat-linker" \
            --packer "$RUNNER_TEMP/hepta-session-native/packer/session-packer" \
            --output "$RUNNER_TEMP/hepta-session-review/growth"

      - name: Build and independently exercise both interactive session runtimes
        shell: bash
        run: |
          make session session-monolithic test-session test-session-monolithic \
            HEPTA_COMPILER="$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            HEPTA_MODULE_COMPILER="$RUNNER_TEMP/hepta-modules-native/module-compiler" \
            HEPTA_FLAT_LINKER="$RUNNER_TEMP/hepta-session-native/flat/flat-linker" \
            HEPTA_SESSION_PACKER="$RUNNER_TEMP/hepta-session-native/packer/session-packer"
          python3 -I -S -B tests/check_session_reports.py native \
            --review "$RUNNER_TEMP/hepta-session-review" \
            --output build/hosted-persistent-session-native.json

      - name: Reproduce the owned-resource ABI2 compiler and native syscall allocator
        shell: bash
        run: |
          sha256sum -c validation/owned-module-package.sha256
          python3 -I -S -B tools/owned_modules/rebuild.py \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --capacity-adaptation "$RUNNER_TEMP/hepta-profile-sources/adaptation.json" \
            --borrowed-tools "$RUNNER_TEMP/hepta-modules-native" \
            --output "$RUNNER_TEMP/hepta-owned-modules"

      - name: Qualify native owner transfer, release, refusal and runtime equivalence
        shell: bash
        run: |
          python3 -I -S -B tools/owned_modules/qualify.py \
            --build "$RUNNER_TEMP/hepta-owned-modules" \
            --source-root "$GITHUB_WORKSPACE/.toolchain/hepta" \
            --borrowed-tools "$RUNNER_TEMP/hepta-modules-native" \
            --baseline-compiler "$RUNNER_TEMP/hepta-expanded/hia-native-compiler" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/hepta-owned-review"
          python3 -I -S -B tests/check_owned_module_reports.py \
            --build "$RUNNER_TEMP/hepta-owned-modules" \
