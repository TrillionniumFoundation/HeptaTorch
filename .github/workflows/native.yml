          def spatial_modules():
              specs = [((1, 2, 5, 5), (3, 2, 3, 2), (1, 1), (1, 0), (1, 1), 1),
                       ((1, 4, 5, 6), (4, 2, 2, 3), (2, 1), (1, 1), (1, 1), 2),
