          def optimizers():
              for decoupled in [False, True]:
                  for wd in [0., f32(.07)]:
                      p = Program()
                      parameter = torch.nn.Parameter(torch.tensor([-.7, .3, 1.2]))
                      x, m, v = p.tensor(parameter, True), p.tensor(torch.zeros(3)), p.tensor(torch.zeros(3))
