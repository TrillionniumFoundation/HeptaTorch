
      - name: Index original recovered tensor-to full672 Saved journals and oracle reports
        if: always()
        env:
          HEPTATORCH_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEPTATORCH_OBSERVER_ARTIFACT: tensor-to-recovered-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          python3 -I -S -B tests/private_node_accounting/collect_private_node_journals.py \
            --build build --journal-root build/frozen35-tensor-to-node --wire-root build/frozen35-tensor-to-node-wire \
            --reports build/pytorch-tensor-to-recovered-frozen35.json build/pytorch-tensor-to-recovered-frozen35-original.json \
              build/pytorch-tensor-to-recovered-observer-controls.json build/tensor-to-recovered-storage-tombstone.json \
              build/pytorch-tensor-to-recovered-backward.json build/tensor-to-recovered-build.json \
              build/tensor-to-recovered-source.json build/pytorch-install.json \
            --job-status '${{ job.status }}'

      - name: Export complete recovered tensor-to HIA build and original runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensor-to-recovered-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            build/tensor-to-recovered/
            build/tensor-to-recovered-source/
            build/frozen35-tensor-to-node/
            build/frozen35-tensor-to-node-wire/
            build/pytorch-tensor-to-recovered-*
            build/tensor-to-recovered-*.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30
